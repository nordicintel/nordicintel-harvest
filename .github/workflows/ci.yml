name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: nordicintel-harvest
      # Core comes from its own tagged release. The adapter is still a sibling checkout
      # because it has no tag yet; drop this step once it does.
      - uses: actions/checkout@v4
        with:
          repository: nordicintel/nordicintel-adapter-pxweb2
          path: nordicintel-adapter-pxweb2
          token: ${{ secrets.NORDICINTEL_REPO_TOKEN }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      # nordicintel-core is a private repository, so the git dependency needs a
      # credential. A token with read access to it is enough.
      - run: git config --global url."https://x-access-token:${{ secrets.NORDICINTEL_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - run: uv sync --all-extras --dev
        working-directory: nordicintel-harvest
      - run: uv run ruff check .
        working-directory: nordicintel-harvest
      - run: uv run mypy
        working-directory: nordicintel-harvest
      - run: uv run pytest -m "not postgres"
        working-directory: nordicintel-harvest

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: nordicintel_test
          POSTGRES_DB: nordicintel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nordicintel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NORDICINTEL_DATABASE_URL: postgresql://postgres:nordicintel_test@localhost:5432/nordicintel
      NORDICINTEL_TEST_DATABASE_URL: postgresql://postgres:nordicintel_test@localhost:5432/nordicintel
    steps:
      - uses: actions/checkout@v4
        with:
          path: nordicintel-harvest
      # Core comes from its own tagged release. The adapter is still a sibling checkout
      # because it has no tag yet; drop this step once it does.
      - uses: actions/checkout@v4
        with:
          repository: nordicintel/nordicintel-adapter-pxweb2
          path: nordicintel-adapter-pxweb2
          token: ${{ secrets.NORDICINTEL_REPO_TOKEN }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      # nordicintel-core is a private repository, so the git dependency needs a
      # credential. A token with read access to it is enough.
      - run: git config --global url."https://x-access-token:${{ secrets.NORDICINTEL_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - run: uv sync --all-extras --dev
        working-directory: nordicintel-harvest
      - run: uv run python -m nordicintel_core.database migrate upgrade head
        working-directory: nordicintel-harvest
      # The pinned core must agree with the database this deployment would run against.
      - run: uv run python -m nordicintel_core.database migrate check
        working-directory: nordicintel-harvest
      - run: uv run pytest -m postgres
        working-directory: nordicintel-harvest
