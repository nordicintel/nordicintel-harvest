[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nordicintel-harvest"
version = "0.1.0"
description = "Harvest scheduler and worker for NordicIntel"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "NordicIntel" }]
dependencies = [
  # Core owns the schema, the repositories and the adapter protocol, so it is pinned
  # exactly: a worker and the database it claims jobs from have to agree. 'migrations' is
  # included so the release task documented in docs/operations.md runs from this image,
  # against exactly the core version the workers were built with.
  "nordicintel-core[db,http,migrations]==0.2.0",
]

# One extra per adapter family a deployment serves. Adapters are configuration, not a
# dependency of the worker itself: install the ones this deployment actually harvests,
# narrow them further with NORDICINTEL_ADAPTERS, and let them register themselves in the
# 'nordicintel.adapters' entry point group.
[project.optional-dependencies]
pxweb2 = ["nordicintel-adapter-pxweb2>=0.1.0"]

[project.scripts]
nordicintel-worker = "nordicintel_harvest.worker:main"
nordicintel-scheduler = "nordicintel_harvest.scheduler:main"
nordicintel-bootstrap = "nordicintel_harvest.bootstrap:main"

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.uv.sources]
nordicintel-core = { git = "https://github.com/nordicintel/nordicintel-core.git", tag = "v0.2.0" }
# Still a sibling checkout: the adapter has no tagged release yet.
nordicintel-adapter-pxweb2 = { path = "../nordicintel-adapter-pxweb2", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/nordicintel_harvest"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "CHANGELOG.md", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["tests"]
markers = ["postgres: requires NORDICINTEL_TEST_DATABASE_URL"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["nordicintel_harvest"]

[tool.uv]
default-groups = ["dev"]
